replicaCount: 1

image:
  repository: dnarlakanti/ecommerce-backend
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 5000

resources:
  requests:
    memory: "128Mi"
    cpu: "25m"
  limits:
    memory: "512Mi"
    cpu: "500m"

env:
  - name: DATABASE_URL
    value: "postgresql://ecommerce:password@ecommerce-postgres:5432/ecommerce"
  - name: ROX_SDK_KEY
    valueFrom:
      secretKeyRef:
        name: ecommerce-feature-flags
        key: sdk-key
        optional: true
